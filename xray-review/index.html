<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0f1419" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>X-ray anatomy review</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to app</a>
    <input
      id="zipInput"
      type="file"
      accept=".zip,application/zip,.ffenc,application/octet-stream"
      hidden
      aria-hidden="true"
    />
    <input
      id="backupInput"
      type="file"
      accept=".zip,application/zip"
      hidden
      aria-hidden="true"
    />
    <div id="app" tabindex="-1"></div>
    <div id="toast" role="status" aria-live="polite"></div>

    <script src="vendor/jszip.min.js"></script>
    <script src="js/expected_digests.js"></script>
    <script src="js/constants.js"></script>
    <script src="js/csv.js"></script>
    <script src="js/validate.js"></script>
    <script src="js/crypto.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/zip-loader.js"></script>
    <script src="js/viewer.js"></script>
    <script src="js/export.js"></script>
    <script src="js/progress-import.js"></script>
    <script src="js/wizard.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
